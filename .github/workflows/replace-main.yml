name: replace main with local history
on:
  push:
    branches:
      - cursor/replace-main-7026
    paths:
      - .github/workflows/replace-main.yml
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/replace-main-7026
          fetch-depth: 1
      - name: Probe token write
        shell: bash
        run: |
          set +e
          code=$(curl -sS -o /tmp/p.json -w '%{http_code}' -X PUT \
            -H "Authorization: bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sllt/coding-agent-lab/contents/probe.txt \
            -d '{"message":"probe","branch":"cursor/replace-main-7026","content":"aGVsbG8K"}')
          echo "probe_http ${code}"
          head -c 400 /tmp/p.json
          echo
          echo "::error::probe_http ${code}"
          exit 0
