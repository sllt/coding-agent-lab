openapi: 3.0.3
info:
  title: Coding Agent Lab API
  version: 1.0.0
  description: |
    本机控制面。成功响应是 {data, request_id}。错误响应是 {error:{code,message}, request_id}。
    未知费用是 null，不是 0。取消返回 202，只表示意图已记录。
    所有字段都是 snake_case。存成 JSON 文本的列（source_spec、draft、snapshot、precheck、doctor、
    protocol、plan、runtime）以嵌套对象返回。凭据值、attempt token、runtime.identity_token、
    precheck 原始日志和服务器绝对路径不会出现在响应里。
    未归类的服务端错误返回 500（code=internal），详情只写服务日志。
servers:
  - url: http://127.0.0.1:43117
paths:
  /api/v1/setup:
    post:
      operationId: setup
      summary: 创建本机管理员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/v1/login:
    post:
      operationId: login
      summary: 登录并设置 HttpOnly 会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: 用户名或密码不正确
        '429':
          description: 同一用户名 15 分钟内失败 5 次后锁定（1 分钟起，最多 30 分钟），带 Retry-After 头
  /api/v1/logout:
    post:
      operationId: logout
      summary: 退出
      responses:
        '200':
          description: 已退出
  /api/v1/session:
    get:
      operationId: session
      summary: 读取当前会话和 CSRF
      responses:
        '200':
          description: 会话
  /api/v1/overview:
    get:
      operationId: overview
      summary: 运行、排队和阻塞计数
      responses:
        '200':
          description: 概览
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: 项目分页
      responses:
        '200':
          description: 项目列表
    post:
      operationId: createProject
      summary: 登记项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDraft'
      responses:
        '201':
          description: 已登记
  /api/v1/projects/{id}/tasks:
    post:
      operationId: createTask
      summary: 创建任务草稿
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDraft'
      responses:
        '201':
          description: 已创建
  /api/v1/projects/{id}/roots:
    post:
      operationId: setAllowedRoots
      summary: 登记任务允许根
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowedRoots'
      responses:
        '200':
          description: 已登记
  /api/v1/tasks/{id}:
    patch:
      operationId: patchTask
      summary: 按 row_version 更新草稿
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: 已更新
  /api/v1/tasks/{id}/publish:
    post:
      operationId: publishTask
      summary: 预检并发布任务版本
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: 已发布
  /api/v1/tasks/{id}/versions:
    get:
      operationId: taskVersions
      summary: 任务版本
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 版本列表
  /api/v1/profiles:
    get:
      operationId: listProfiles
      summary: 配置草稿
      responses:
        '200':
          description: 配置列表；latest 按 profile_id 给出最新已发布版本和 doctor 就绪度
    post:
      operationId: createProfile
      summary: 创建配置草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileDraft'
      responses:
        '201':
          description: 已创建
  /api/v1/profiles/{id}/doctor:
    post:
      operationId: doctorProfile
      summary: 静态 doctor，不调用付费模型
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorRequest'
      responses:
        '200':
          description: 检查报告
  /api/v1/profiles/{id}/publish:
    post:
      operationId: publishProfile
      summary: 发布配置版本
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: 已发布
  /api/v1/experiments/preview:
    post:
      operationId: previewExperiment
      summary: 计算 Trial 数量，不启动
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentPlan'
      responses:
        '200':
          description: 规模
  /api/v1/experiments:
    post:
      operationId: submitExperiment
      summary: 幂等提交实验计划
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentPlan'
      responses:
        '202':
          description: 已排队
    get:
      operationId: listExperiments
      summary: 实验列表
      responses:
        '200':
          description: 实验列表
  /api/v1/experiments/{id}:
    get:
      operationId: getExperiment
      summary: 计划、Trial 和分母
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 实验；labels 给出所用任务版本和配置版本的名称，便于画任务 × 配置矩阵
  /api/v1/experiments/{id}/export:
    post:
      operationId: exportExperiment
      summary: 导出，不含凭据和参考解
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: 导出制品
  /api/v1/trials/{id}:
    get:
      operationId: getTrial
      summary: Trial 与历史 Attempt
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Trial
  /api/v1/trials/{id}/cancel:
    post:
      operationId: cancelTrial
      summary: 记录取消意图
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: 已记录
  /api/v1/trials/{id}/attempts:
    post:
      operationId: retryTrial
      summary: 带原因的人工重试
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
      responses:
        '202':
          description: 已排队
  /api/v1/attempts/{id}/events:
    get:
      operationId: attemptEvents
      summary: SSE，支持 Last-Event-ID 与 gap
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 事件流
  /api/v1/attempts/{id}/checks:
    get:
      operationId: attemptChecks
      summary: 独立验收证据
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 检查
  /api/v1/attempts/{id}/artifacts:
    get:
      operationId: attemptArtifacts
      summary: 制品清单
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 制品
  /api/v1/attempts/{id}/usage:
    get:
      operationId: attemptUsage
      summary: 可空用量
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 用量
  /api/v1/attempts/{id}/reviews:
    get:
      operationId: listReviews
      summary: 人工意见
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 意见
    post:
      operationId: addReview
      summary: 记录意见，不改写结论
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
      responses:
        '201':
          description: 已记录
  /api/v1/artifacts/{id}/download:
    get:
      operationId: downloadArtifact
      summary: 按制品 ID 下载
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 文件
  /api/v1/comparisons:
    get:
      operationId: comparisons
      summary: 可比条件下的计数
      parameters:
        - name: experiment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 对比表
  /api/v1/catalog:
    get:
      operationId: catalog
      summary: 已发布的任务版本和配置版本（含 doctor 就绪度），用于创建实验
      responses:
        '200':
          description: tasks 和 profiles 两个列表
  /api/v1/settings:
    get:
      operationId: settings
      summary: 执行器、网络和备份状态
      responses:
        '200':
          description: 设置
    patch:
      operationId: patchSettings
      summary: 保存并发、保留天数和磁盘配额
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: 已保存
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: 审计记录
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 审计列表
  /api/v1/upgrade:
    get:
      operationId: upgrade
      summary: 升级路径，要求先备份
      responses:
        '200':
          description: 升级说明
  /api/v1/maintenance/retention:
    post:
      operationId: retention
      summary: 预览或按策略删除过期日志和报告
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionRequest'
      responses:
        '200':
          description: 保留计划
  /api/v1/maintenance/quarantine:
    post:
      operationId: cleanQuarantine
      summary: 清理隔离工作区
      responses:
        '200':
          description: 清理结果
  /api/v1/maintenance/backup:
    post:
      operationId: backup
      summary: 维护模式备份
      responses:
        '200':
          description: 备份路径（$DATA/backups/...，不含服务器绝对路径）
        '409':
          description: 已有备份在进行（code=busy），或仍有未结束的 Attempt
  /api/v1/exports/harbor:
    post:
      operationId: exportHarbor
      summary: 导出 Harbor 子集
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarborExport'
      responses:
        '200':
          description: 子集
  /api/v1/tasks/{id}/flaky:
    post:
      operationId: markFlaky
      summary: 标记任务不稳定，使其离开默认对比集
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlakyMark'
      responses:
        '200':
          description: 已记录
  /api/v1/trials/{id}/adopt:
    post:
      operationId: adoptPatch
      summary: 只记录采纳补丁，不写入源目录
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: 已记录
  /api/v1/imports/harbor:
    post:
      operationId: importHarbor
      summary: 导入 Harbor 子集并列出未映射字段
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarborSubset'
      responses:
        '200':
          description: 映射结果
  /api/v1/webhooks:
    post:
      operationId: webhook
      summary: 签名通知，重复投递只记一次，不自动合并
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookBody'
      parameters:
        - name: X-Agentlab-Timestamp
          in: header
          required: true
          description: Unix 秒。与服务器时间相差超过 5 分钟的请求被拒绝。
          schema:
            type: string
        - name: X-Agentlab-Dedupe
          in: header
          required: true
          description: 去重键，最长 200 字符，参与签名。
          schema:
            type: string
        - name: X-Agentlab-Signature
          in: header
          required: true
          description: hex(HMAC-SHA256(secret, timestamp + "\n" + dedupe + "\n" + body))，可带 v1= 前缀。
          schema:
            type: string
      responses:
        '200':
          description: 已接受
        '401':
          description: 签名错误、缺时间戳或时间戳过期（code=stale）
        '409':
          description: 同一去重键对应了不同正文
        '422':
          description: notify_url 不是带端口的 http 本机地址
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: 账号引用
      responses:
        '200':
          description: 账号
    post:
      operationId: createAccount
      summary: 保存凭据引用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDraft'
      responses:
        '201':
          description: 已保存
  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: 环境版本
      responses:
        '200':
          description: 环境
    post:
      operationId: createEnvironment
      summary: 发布环境快照
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentDraft'
      responses:
        '201':
          description: 已发布
        '422':
          description: network 不是 unrestricted（restricted/offline 尚未强制执行）
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    Envelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
    Credentials:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8
    ProjectDraft:
      type: object
      required: [name]
      properties:
        name:
          type: string
        source_spec:
          type: object
          additionalProperties: true
    AllowedRoots:
      type: object
      required: [roots]
      additionalProperties: false
      properties:
        roots:
          type: array
          items:
            type: string
    TaskDraft:
      type: object
      required: [name, prompt]
      additionalProperties: false
      properties:
        name:
          type: string
        prompt:
          type: string
        source_dir:
          type: string
        verifier_root:
          type: string
        base_commit:
          type: string
    TaskPatch:
      type: object
      required: [row_version]
      description: 传 draft（对象，和 GET 返回的形状一致）或 draft_json（字符串，兼容旧客户端）之一。
      properties:
        name:
          type: string
        draft:
          type: object
        draft_json:
          type: string
        row_version:
          type: integer
    ProfileBody:
      type: object
      required: [adapter, display_name]
      properties:
        adapter:
          type: string
          enum: [fixture, cursor, grok, opencode]
        model:
          type: string
        fake_mode:
          type: string
        executor:
          type: string
        network:
          type: string
        display_name:
          type: string
        executable:
          type: string
        approve_tools:
          type: boolean
        credential_env:
          type: array
          description: 转发给 Agent 的环境变量名（只存名字，不存值）。PATH、HOME、LD_* 等会被拒绝。
          items:
            type: string
        inherit_home:
          type: boolean
          description: 让 Agent 使用真实 HOME（读取 CLI 登录态）。默认 false。
        wall_seconds:
          type: integer
          minimum: 5
          maximum: 86400
    ProfileDraft:
      type: object
      required: [name, account_id, profile]
      properties:
        name:
          type: string
        account_id:
          type: string
        profile:
          $ref: '#/components/schemas/ProfileBody'
    DoctorRequest:
      type: object
      properties:
        allow_model_call:
          type: boolean
    ExperimentPlan:
      type: object
      required: [task_version_ids, profile_version_ids, repetitions]
      properties:
        name:
          type: string
          maxLength: 120
          description: 展示用名称，不进入计划摘要。
        description:
          type: string
          maxLength: 2000
        mode:
          type: string
        task_version_ids:
          type: array
          items:
            type: string
        profile_version_ids:
          type: array
          items:
            type: string
        repetitions:
          type: integer
          minimum: 1
          maximum: 30
        protocol:
          type: string
    RetryRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
    Review:
      type: object
      required: [kind, body]
      properties:
        kind:
          type: string
        body:
          type: string
    HarborSubset:
      type: object
      required: [schema_version, name, instruction]
      properties:
        schema_version:
          type: string
        name:
          type: string
        instruction:
          type: string
        environment:
          type: object
          additionalProperties: true
    WebhookBody:
      type: object
      additionalProperties: true
    AccountDraft:
      type: object
      required: [auth_kind, credential_ref]
      properties:
        auth_kind:
          type: string
        credential_ref:
          type: string
        concurrency:
          type: integer
    EnvironmentDraft:
      type: object
      required: [name]
      properties:
        name:
          type: string
        executor:
          type: string
        network:
          type: string
          enum: [unrestricted]
          description: restricted / offline 尚未强制执行，提交返回 422。
    SettingsPatch:
      type: object
      required: [global_limit, retention, disk_quota_bytes]
      properties:
        global_limit:
          type: integer
          minimum: 1
          maximum: 8
        disk_quota_bytes:
          type: integer
          minimum: 0
        agent_wall_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Agent 墙钟上限；0 表示用环境变量或默认 1800 秒。
        retention:
          type: object
          properties:
            log_days:
              type: integer
            patch_days:
              type: integer
            report_days:
              type: integer
    RetentionRequest:
      type: object
      properties:
        apply:
          type: boolean
    HarborExport:
      type: object
      required: [name, prompt]
      additionalProperties: false
      properties:
        name:
          type: string
        prompt:
          type: string
    FlakyMark:
      type: object
      required: [task_version_id]
      properties:
        task_version_id:
          type: string
        fail_rate:
          type: string
        note:
          type: string
        flaky:
          type: boolean
